name: Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create semantic release
        id: semantic-release
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
          update-file: VERSION
          allow-initial-development-versions: true

      - name: Build installation bundle
        if: steps.semantic-release.outputs.version != ''
        env:
          IMG: ghcr.io/${{ github.repository }}:v${{ steps.semantic-release.outputs.version }}
        run: make build-installer IMG="$IMG"

      - name: Set up Helm
        if: steps.semantic-release.outputs.version != ''
        uses: azure/setup-helm@v5

      - name: Package Helm chart
        if: steps.semantic-release.outputs.version != ''
        env:
          CHART_VERSION: ${{ steps.semantic-release.outputs.version }}
          CHART_APP_VERSION: ${{ steps.semantic-release.outputs.version }}
        run: make helm-package

      - name: Upload installation bundle
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.semantic-release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" dist/install.yaml --clobber

      - name: Upload Helm chart
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.semantic-release.outputs.version }}
          CHART_VERSION: ${{ steps.semantic-release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" "dist/trussium-operator-${CHART_VERSION}.tgz" --clobber

      - name: Upload upgrade compatibility matrix
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.semantic-release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" docs/UPGRADE-MATRIX.md --clobber

      - name: Publish Helm chart to OCI registry
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/trussium-operator-${CHART_VERSION}.tgz" oci://ghcr.io/trussiumhq/charts

      - name: Dispatch container publication
        if: steps.semantic-release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.semantic-release.outputs.version }}
        run: gh workflow run container.yml --ref "$RELEASE_TAG"
