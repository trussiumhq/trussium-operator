name: Bug report
description: Report a reproducible problem in the Trussium Operator
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        Do not include credentials, Secret contents, customer data, or other
        sensitive information.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem.
      placeholder: The operator...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Install...
        2. Apply...
        3. Observe...
    validations:
      required: true

  - type: input
    id: operator-version
    attributes:
      label: Operator version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Trussium runtime version
      placeholder: v0.x.y

  - type: input
    id: kubernetes-version
    attributes:
      label: Kubernetes version
      placeholder: v1.x.y
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and sensitive information.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed credentials and sensitive data.
          required: true
        - label: This is not a private security vulnerability.
          required: true
