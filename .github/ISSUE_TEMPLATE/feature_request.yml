name: Feature request
description: Propose a focused operator capability or improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Kubernetes or Trussium operating problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the desired behaviour.
    validations:
      required: true

  - type: textarea
    id: user-workflow
    attributes:
      label: User workflow
      description: Show how a Kubernetes user would use the capability.
      placeholder: |
        apiVersion: runtime.trussium.io/v1alpha1
        kind: TrussiumRuntime
        metadata:
          name: example

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing Kubernetes-native alternatives or workarounds.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Could this affect CRD compatibility, upgrades, or runtime versions?

  - type: textarea
    id: out-of-scope
    attributes:
      label: Suggested out-of-scope work
      description: What should not be included in the first implementation?

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and roadmap items.
          required: true
        - label: This proposal preserves the public operator and runtime boundary.
          required: true
