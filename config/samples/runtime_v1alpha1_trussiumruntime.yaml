apiVersion: runtime.trussium.io/v1alpha1
kind: TrussiumRuntime
metadata:
  name: private-ai
  namespace: trussium
spec:
  image:
    repository: ghcr.io/trussiumhq/trussium
    tag: v0.23.0
    pullPolicy: IfNotPresent

  replicas: 2

  provider:
    type: ollama
    model: llama3.2
    baseURL: http://ollama.ollama.svc.cluster.local:11434/v1

  runtime:
    shutdownDrainTimeoutSeconds: 30

  service:
    type: ClusterIP
    port: 9000

  podMetadata:
    labels:
      team: ai-platform
    annotations:
      example.com/owner: inference

  scheduling:
    nodeSelector:
      workload: ai
    tolerations:
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
