# This rule is not used by the project trussium-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to runtime.trussium.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: trussium-operator
    app.kubernetes.io/managed-by: kustomize
  name: trussiumruntime-viewer-role
rules:
- apiGroups:
  - runtime.trussium.io
  resources:
  - trussiumruntimes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - runtime.trussium.io
  resources:
  - trussiumruntimes/status
  verbs:
  - get
